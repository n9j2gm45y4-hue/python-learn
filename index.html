<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 学习平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <span class="logo">🐍 Python 学习平台</span>
  <span id="mode-indicator" class="mode offline">🟡 在线模式（未连接本地Python）</span>
  <span class="spacer"></span>
  <a id="btn-download-bridge" class="btn-small" href="local-bridge.zip" download>下载本地执行器</a>
</header>

<main id="layout">
  <aside id="sidebar">
    <h3>学习目录</h3>
    <div id="progress-bar-wrap">
      <div id="progress-bar"></div>
      <span id="progress-text">0%</span>
    </div>
    <ul id="course-list"></ul>
  </aside>

  <section id="content">
    <div id="lesson-body">
      <h1>欢迎</h1>
      <p>从左侧选择章节开始学习。</p>
    </div>
    <div id="exercise-area">
      <h3>练习题</h3>
      <div id="exercise-list"></div>
    </div>
  </section>

  <section id="right-panel">
    <div id="editor-toolbar">
      <button id="btn-run" class="btn-run">▶ 运行 (Ctrl+Enter)</button>
      <button id="btn-judge" class="btn-small">提交判题</button>
      <button id="btn-explain" class="btn-small">AI 讲解</button>
    </div>
    <div id="editor"></div>
    <div id="output-wrap">
      <div class="out-header">输出</div>
      <pre id="output"></pre>
    </div>
    <div id="ai-panel">
      <div class="ai-header">🤖 AI 助教
        <button id="btn-ai-toggle" class="btn-small">收起</button>
      </div>
      <div id="ai-messages"></div>
      <div id="ai-input-row">
        <input id="ai-input" placeholder="问 AI 问题…" />
        <button id="btn-ai-send">发送</button>
      </div>
    </div>
  </section>
</main>

<div id="error-popup" class="hidden">
  <div class="popup-head"><span>⚠️ 语法错误</span><button id="popup-close">×</button></div>
  <pre id="error-text"></pre>
  <div id="error-ai-tip">AI 正在讲解…</div>
  <button id="btn-error-explain">让 AI 详细讲解</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

<script src="js/courses.js"></script>
<script src="js/progress.js"></script>
<script src="js/editor.js"></script>
<script src="js/runner.js"></script>
<script src="js/judge.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
